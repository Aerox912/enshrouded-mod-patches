name: Build and release
on:
  push:
    branches: [main, 'release/**']
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build, test and package
        shell: pwsh
        run: ./ci/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: mod-patches
          path: dist/*
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets=@(Get-ChildItem ./dist -File | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME --draft --title $env:GITHUB_REF_NAME --generate-notes @assets
          if ($LASTEXITCODE) { throw 'Release upload failed' }
          gh release edit $env:GITHUB_REF_NAME --draft=false
          if ($LASTEXITCODE) { throw 'Release publication failed' }


  notify-packages:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && vars.RELEASE_APP_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: Aerox912
          repositories: |
            enshrouded-client-installer
            enshrouded-server-compat
          permission-contents: write
      - name: Notify only affected packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: ./ci/notify-packages.ps1
